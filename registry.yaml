# =============================================================================
# registry.yaml
# =============================================================================
# The list of tools shown as cards on the Toolbox home page ("/").
#
# This is display metadata only — it does NOT wire up the routing. To
# actually add a tool you still need one `app.mount(...)` line in main.py
# (see main.py's docstring). This file just controls what shows up on the
# home page and what each card says.
# =============================================================================

tools:
  - name: datadiff-pro
    title: "DataDiff Pro"
    description: "Deep smart diff for JSON, XML & CSV — nested objects, list keys, equivalence rules"
    icon: "🔍"

  - name: encode-decode
    title: "Encode/Decode"
    description: "Base64, URL, Hex, HTML entities, Gzip, AES, RSA, JWT, hashing — all client-side, nothing leaves your browser"
    icon: "🔐"

  - name: subnet-calc
    title: "Subnet Calculator"
    description: "Interactive IPv4 subnetting — binary bit visualization and a worked explanation for every answer"
    icon: "🧮"
